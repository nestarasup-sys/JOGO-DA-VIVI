name: V3 CI
on:
  push:
    branches: [main, v3-ultra, oai/romance-system-overhaul-v4]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run assets:slice
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-v3-dist
          path: dist
